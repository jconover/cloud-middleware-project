---
- name: Install Docker
  yum:
    name: docker
    state: present
  become: true

- name: Start Docker Service
  service:
    name: docker
    state: started
    enabled: yes
  become: true

- name: Add ec2-user to docker group
  user:
    name: ec2-user
    groups: docker
    append: yes
  become: true

- name: Install Docker Compose Plugin
  yum:
    name: docker-compose-plugin
    state: present
  become: true

- name: Create monitoring directory
  file:
    path: /home/ec2-user/monitoring
    state: directory
    owner: ec2-user
    group: ec2-user

- name: Create prometheus config directory
  file:
    path: /home/ec2-user/monitoring/prometheus
    state: directory
    owner: ec2-user
    group: ec2-user

- name: Copy Prometheus Config
  copy:
    src: ../../../monitoring/prometheus/prometheus.yml
    dest: /home/ec2-user/monitoring/prometheus/prometheus.yml
    owner: ec2-user
    group: ec2-user

- name: Copy Docker Compose
  copy:
    src: ../../../monitoring/docker-compose.yml
    dest: /home/ec2-user/monitoring/docker-compose.yml
    owner: ec2-user
    group: ec2-user

- name: Start Monitoring Stack
  shell: docker compose up -d
  args:
    chdir: /home/ec2-user/monitoring
  become: true
