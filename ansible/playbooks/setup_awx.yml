---
- name: Install AWX on EKS
  hosts: localhost
  connection: local
  vars:
    kubeconfig_path: "~/.kube/config"

  tasks:
    - name: Add AWX Operator Helm Repo
      kubernetes.core.helm_repository:
        name: awx-operator
        repo_url: "https://ansible.github.io/awx-operator/"

    - name: Install AWX Operator via Helm
      kubernetes.core.helm:
        name: awx-operator
        chart_ref: awx-operator/awx-operator
        release_namespace: awx
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"

    - name: Wait for Operator to be ready
      command: kubectl wait --for=condition=available --timeout=600s deployment/awx-operator-controller-manager -n awx

    - name: Create AWX Instance
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: awx.ansible.com/v1beta1
          kind: AWX
          metadata:
            name: awx-demo
            namespace: awx
          spec:
            service_type: LoadBalancer
        kubeconfig: "{{ kubeconfig_path }}"
